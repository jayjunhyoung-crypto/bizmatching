<!DOCTYPE html>
<html><head><meta charset="utf-8"></head>
<body style="margin:0">
<script>
// Keeps a copy of the work in this browser (localStorage), so a refresh or a closed tab loses nothing.
(function () {
  function send(type, data) { window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, data || {}), "*"); }
  let told = false;
  window.addEventListener("message", (event) => {
    const msg = event.data;
    if (!msg || msg.type !== "streamlit:render") return;
    let a = (msg.args || {}).data || msg.args || {};
    if (typeof a === "string") { try { a = JSON.parse(a); } catch (e) { a = {}; } }
    const key = a.key || "bizmatch";
    let store = null;
    try { store = window.localStorage; } catch (e) { store = null; }
    if (!told) {
      told = true;
      let v = "";
      try { v = (store && store.getItem(key)) || ""; } catch (e) { v = ""; }
      send("streamlit:setComponentValue", { value: { loaded: v, ok: !!store }, dataType: "json" });
    }
    if (a.save && store) { try { store.setItem(key, a.save); } catch (e) { /* full or blocked */ } }
    if (a.clear && store) { try { store.removeItem(key); } catch (e) {} }
  });
  send("streamlit:componentReady", { apiVersion: 1 });
  send("streamlit:setFrameHeight", { height: 0 });
})();
</script>
</body></html>
