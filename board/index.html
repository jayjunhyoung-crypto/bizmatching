<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BizMatch board</title>
<style>
:root{--ink:#111827;--mut:#6b7280;--line:#e3e6ee;--bg:#ffffff;--zone:#f4f6fa;--head:#eef1f6;--headink:#334155;--cob:#1240e0;
 --red:#d92d20;--amber:#e08a00;--green:#14a44d;--panel:#ffffff;font-family:"Source Sans Pro","Source Sans 3",Inter,system-ui,sans-serif}
body.dark{--ink:#e8ebf3;--mut:#9aa3b8;--line:#2a3350;--bg:#0e1117;--zone:#161b28;--head:#1b2234;--headink:#cbd3e6;--panel:#121725}
*{box-sizing:border-box}
html,body{margin:0;background:transparent;color:var(--ink);font-size:13px}
body{user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:2px 0 10px}
.btn{appearance:none;border:1px solid var(--line);background:var(--panel);border-radius:8px;min-height:34px;padding:0 12px;
 cursor:pointer;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--cob)}
.btn:disabled{opacity:.4;cursor:default}
.btn.on{background:var(--zone)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:4px 10px;background:var(--zone);font-weight:600;white-space:nowrap}
.pill i{width:9px;height:9px;border-radius:50%;display:inline-block}
.pill.bad{background:rgba(217,45,32,.12);color:var(--red);cursor:pointer}
.spacer{flex:1}
.clock{font-weight:700;font-variant-numeric:tabular-nums}
.notes{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 10px;background:var(--panel);display:grid;gap:4px}
.notes b{color:var(--red)}
.tray{border:1.5px dashed var(--line);border-radius:10px;padding:8px;margin:0 0 10px;display:flex;flex-wrap:wrap;gap:6px;
 align-items:center;min-height:48px;transition:background .12s,border-color .12s}
.tray .lab{color:var(--mut);font-weight:600;margin-right:4px}
.tray.hot{border-color:var(--cob);background:rgba(18,64,224,.06)}
.tray .chip{min-width:150px}
.wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel);position:relative}
table.g{border-collapse:separate;border-spacing:0;min-width:100%}
.g th{background:var(--head);color:var(--headink);font-weight:700;padding:10px 8px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:3;white-space:nowrap;text-align:center;
 transform:translateY(var(--st,0px));will-change:transform}
html.fs,body.fs{background:var(--bg)}
body.fs{padding:12px 16px}
.btn.fsb{margin-left:4px}
.g td{border-bottom:1px solid var(--line);border-left:1px solid var(--line);padding:4px;vertical-align:middle}
.g td.sess{position:sticky;left:0;z-index:2;background:var(--panel);text-align:center;font-weight:700;min-width:82px;border-left:0}
.g td.sess small{display:block;font-weight:500;color:var(--mut)}
.g td.time{text-align:center;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums;min-width:94px;
 position:sticky;left:82px;z-index:2;background:var(--panel)}
.g td.sess{width:82px;max-width:82px}
.g th.c-sess{position:sticky;left:0;z-index:5}
.g th.c-time{position:sticky;left:82px;z-index:5}
.g tr.brk td.time{background:var(--zone)}
/* big events (10+ tables): slimmer cells so more tables fit on screen */
.compact .cell{min-width:100px;height:56px}
.compact .chip{padding:4px 5px;min-height:48px}
.compact .chip b{font-size:12px}
.compact .chip .h{font-size:10px}
.g tr.now td.time{color:#fff;background:var(--cob)}
.g tr.now td{background-color:rgba(18,64,224,.05)}
.g tr.brk td{background:var(--zone);color:var(--mut);font-weight:700;text-align:center;height:30px;letter-spacing:.02em}
.cell{min-width:118px;height:62px;border-radius:9px;transition:background .12s,box-shadow .12s;display:flex;align-items:stretch}
.cell.pc{min-width:130px;flex-direction:column;gap:3px}
.cell .dash{flex:1;display:flex;align-items:center;justify-content:center;color:var(--line);font-size:16px}
.cell.fit{box-shadow:inset 0 0 0 2.5px var(--green);background:rgba(20,164,77,.10)}
.cell.push{box-shadow:inset 0 0 0 2.5px var(--amber);background:rgba(224,138,0,.12)}
.cell.clash{box-shadow:inset 0 0 0 2.5px var(--red);background:rgba(217,45,32,.12)}
.cell.self{box-shadow:inset 0 0 0 2px var(--line)}
td.wait{font-size:11.5px;color:var(--mut);min-width:170px;max-width:320px;text-align:center;line-height:1.3}
.chip{flex:1;border-radius:9px;box-shadow:inset 0 0 0 1px rgba(17,24,39,.06);padding:6px 8px;text-align:center;cursor:grab;line-height:1.22;position:relative;
 touch-action:none;transition:transform .16s cubic-bezier(.2,.8,.2,1),box-shadow .16s,opacity .16s;
 display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:54px}
.chip:hover{box-shadow:0 2px 10px rgba(0,0,0,.15);transform:translateY(-1px)}
.chip b{font-size:13px;font-weight:700}
.chip .h{font-size:11px;opacity:.85}
.chip .st{margin-top:3px;font-size:10px;font-weight:700;border-radius:99px;padding:1px 7px;background:rgba(255,255,255,.78);color:#1f2430}
.chip .st.Ongoing{background:var(--cob);color:#fff}
.chip .st.Done{background:#ddf2e3;color:#1e7b34}
.chip .st.No-Show{background:#fde2e6;color:#b4132d}
.chip.ns{filter:grayscale(1);opacity:.55}
.chip.ns b{text-decoration:line-through}
.chip.done{opacity:.72}
.chip.ongoing{box-shadow:0 0 0 2.5px var(--cob)}
.chip .pin{position:absolute;top:4px;right:5px;width:11px;height:11px;opacity:.8}
.chip.bad{outline:2.5px solid var(--red);outline-offset:1px}
.chip.bad::after{content:"!";position:absolute;top:-7px;left:-7px;width:16px;height:16px;border-radius:50%;background:var(--red);
 color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center}
.chip.lift{opacity:.25;transform:scale(.96)}
.chip.pinned{cursor:default;box-shadow:inset 0 0 0 2px rgba(17,24,39,.55)}
.chip.snap{animation:snap .32s cubic-bezier(.2,.8,.2,1)}
.chip.bump{animation:bump .6s ease}
@keyframes snap{0%{transform:scale(1.10)}55%{transform:scale(.96)}100%{transform:scale(1)}}
@keyframes bump{0%{box-shadow:0 0 0 0 rgba(224,138,0,.9)}100%{box-shadow:0 0 0 12px rgba(224,138,0,0)}}
.chip.pol{color:#1f2430;min-height:50px;padding:4px 6px;box-shadow:inset 0 0 0 1.5px #64748b}
.chip.pol small{font-size:10px;opacity:.65;font-weight:600}
.ghost{position:fixed;z-index:60;pointer-events:none;box-shadow:0 14px 32px rgba(0,0,0,.28);transform:rotate(-1.5deg) scale(1.04);
 border-radius:9px}
.ghost[data-kind=fit]{box-shadow:0 0 0 3px var(--green),0 14px 32px rgba(0,0,0,.28)}
.ghost[data-kind=push]{box-shadow:0 0 0 3px var(--amber),0 14px 32px rgba(0,0,0,.28)}
.ghost[data-kind=clash]{box-shadow:0 0 0 3px var(--red),0 14px 32px rgba(0,0,0,.28)}
.ghost.snapped{transition:left .11s ease-out,top .11s ease-out;transform:rotate(0) scale(1)}
.hint{position:fixed;z-index:61;pointer-events:none;background:#111827;color:#fff;border-radius:8px;padding:6px 9px;font-size:12px;
 max-width:300px;line-height:1.35;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.hint.fit{background:#0f7a3a}.hint.push{background:#9a5b00}.hint.clash{background:#b42318}
.menu{position:absolute;z-index:70;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px;
 box-shadow:0 10px 28px rgba(0,0,0,.2);display:grid;min-width:190px}
.menu .t{font-weight:700;padding:4px 8px 6px;border-bottom:1px solid var(--line);margin-bottom:4px}
.menu .t small{display:block;font-weight:500;color:var(--mut)}
.menu button{appearance:none;border:0;background:none;text-align:left;padding:7px 8px;border-radius:6px;cursor:pointer;display:flex;gap:8px;align-items:center}
.menu button:hover,.menu button.cur{background:var(--zone)}
.menu .why{color:var(--red);padding:4px 8px;font-size:12px;max-width:260px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.toast{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);background:#111827;color:#fff;border-radius:10px;padding:9px 14px;
 font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:80;max-width:92vw}
.toast.on{opacity:1}
.toast.bad{background:#b42318}
.legend{display:flex;gap:12px;flex-wrap:wrap;color:var(--mut);font-size:12px}
.legend span{display:inline-flex;gap:5px;align-items:center}
.legend i{width:14px;height:10px;border-radius:3px;display:inline-block}
.find{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 10px}
.find .box{position:relative;flex:0 1 320px}
.find input{width:100%;border:1.5px solid var(--line);border-radius:9px;background:var(--panel);padding:7px 30px 7px 32px;outline:none;font:inherit;color:inherit}
.find input:focus{border-color:var(--cob)}
.find .box svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.5}
.find .x{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;cursor:pointer;color:var(--mut);font-size:16px;display:none}
.find .x.on{display:block}
.find .info{color:var(--mut);font-size:12.5px}
.find .info b{color:var(--ink)}
body.dark .stag{background:hsl(var(--sh,220) 30% 22%);color:hsl(var(--sh,220) 60% 85%);box-shadow:none}
.focusing .chip:not(.hit){opacity:.13;filter:grayscale(.8)}
.focusing .chip.hit{box-shadow:0 0 0 3px #f5b800,0 4px 14px rgba(0,0,0,.18);z-index:1}
.focusing .tag:not(.hit),.focusing .stag:not(.hit){opacity:.28}
.focusing tr.miss td.time{color:var(--mut)}
.tag.hit,.stag.hit{box-shadow:0 0 0 2px #f5b800}
td.free{min-width:150px;max-width:240px;vertical-align:middle}
.tags{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.tag{display:inline-flex;align-items:center;gap:5px;border:1.5px dashed color-mix(in srgb,var(--hc) 65%,#000);
 background:color-mix(in srgb,var(--hc) 16%,var(--panel));color:var(--ink);border-radius:99px;
 padding:2px 9px 2px 6px;font-size:11.5px;font-weight:700;cursor:grab;touch-action:none;white-space:nowrap;line-height:1.5}
.tag:hover{border-style:solid;background:color-mix(in srgb,var(--hc) 30%,var(--panel))}
.tag i{width:8px;height:8px;border-radius:50%;background:var(--hc);flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.tag small{font-weight:500;color:var(--mut)}
.tag.lift{opacity:.3}
.tag.ghost{border-style:solid;background:var(--panel)}
.stag{display:inline-block;border-radius:5px;padding:0 6px;background:hsl(var(--sh,220) var(--ss,70%) var(--sl,90%));color:hsl(var(--sh,220) 40% 24%);
 box-shadow:inset 0 0 0 1px hsl(var(--sh,220) 40% 74%);font-weight:600;font-size:11px;line-height:1.5;cursor:pointer;margin:1px 0;transition:background .12s,box-shadow .12s}
.stag sup{font-size:9px;font-weight:800;margin-left:3px;opacity:.75;vertical-align:1px}
.chip .sub{position:absolute;top:-7px;right:-6px;background:var(--cob);color:#fff;font-size:9.5px;font-weight:800;border-radius:99px;padding:1px 6px;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.rcard .tabs{display:flex;gap:4px;padding:8px 14px 0}
.rcard .tabs button{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:4px 11px;cursor:pointer;font-weight:700;font-size:12px}
.rcard .tabs button.on{background:var(--cob);border-color:var(--cob);color:#fff}
.rcard .lead{padding:8px 14px 2px;color:var(--mut);font-size:12px}
.stag.fit{background:rgba(20,164,77,.18);color:var(--ink);box-shadow:0 0 0 2px var(--green)}
.stag.clash{background:rgba(217,45,32,.14);color:var(--ink);box-shadow:0 0 0 2px var(--red)}
.menu .pick{max-height:300px;overflow:auto;display:grid}
.pcard{width:430px;max-width:calc(100vw - 16px);padding:0}
.pcard .ph{display:flex;gap:10px;align-items:flex-start;padding:12px 14px 10px;border-bottom:1px solid var(--line)}
.pcard .ph i{width:14px;height:14px;border-radius:4px;flex:none;margin-top:3px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.pcard .ph b{font-size:15px;display:block}
.pcard .ph small{color:var(--mut);display:block;margin-top:1px}
.pcard .ph .x{margin-left:auto;border:0;background:none;font-size:18px;cursor:pointer;color:var(--mut);padding:0 4px}
.pcard .want{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.pcard .want span{background:rgba(18,64,224,.09);color:var(--cob);border-radius:5px;padding:1px 6px;font-size:11px;font-weight:700}
.pcard .stats{display:flex;gap:14px;padding:8px 14px;color:var(--mut);font-size:12px;border-bottom:1px solid var(--line)}
.pcard .stats b{color:var(--ink);font-size:14px}
.pcard .sec{padding:8px 14px 4px;font-weight:700;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.03em;display:flex;justify-content:space-between}
.pcard .list{max-height:300px;overflow:auto;padding:0 8px 8px}
.pcard .row{display:flex;align-items:center;gap:8px;padding:6px;border-radius:8px}
.pcard .row:hover{background:var(--zone)}
.pcard .row .nm{font-weight:700;white-space:nowrap}
.pcard .row .why{display:flex;flex-wrap:wrap;gap:3px;margin-top:2px;padding:0;max-width:none;color:inherit;font-size:inherit}
.pcard .row .why span{font-size:10.5px;border-radius:4px;padding:0 5px;background:var(--zone);color:var(--mut);font-weight:600}
.pcard .row .why span.g{background:rgba(20,164,77,.13);color:#0f7a3a}
.pcard .row .why span.a{background:rgba(224,160,0,.16);color:#8a5a00}
.pcard .row .why span.r{background:rgba(217,45,32,.1);color:var(--red)}
.pcard .row .go{margin-left:auto;flex:none;border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:4px 10px;cursor:pointer;font-weight:700;font-size:12px;white-space:nowrap}
.pcard .row .go:hover{border-color:var(--cob);color:var(--cob)}
.pcard .row .go:disabled{opacity:.4;cursor:default}
.pcard .met{display:flex;flex-wrap:wrap;gap:4px;padding:0 14px 12px}
.pcard .met span{font-size:11.5px;background:var(--zone);border-radius:5px;padding:1px 6px}
.pcard .met span small{color:var(--mut)}
.pcard .empty{color:var(--mut);padding:4px 8px 10px;font-size:12px}
.menu .pick small{color:var(--mut);margin-left:auto;padding-left:10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

  // ---------------- cancellations: who steps in right now ----------------
  function present(k) {           // partners in the room at slot k: meeting now, or free and available

  function counts(st) { const c = {}; st.meetings.forEach((m) => { c[m.startup] = (c[m.startup] || 0) + 1; c[m.host] = (c[m.host] || 0) + 1; }); return c; }
  // startups who can take the place of m.startup with m.host, best first
  function startupSubs(st, m) {
    const k = m.k, h = m.host, b = busy(st, k), cnt = counts(st), out = [];
    Object.keys(D.startups).forEach((c) => {
      if (c === m.startup || !D.startups[c].avail[k] || (D.startups[c].no || {})[h]) return;
      const same = st.meetings.find((x) => x.startup === c && x.host === h);
      if (same && (same.k <= k || same.lock)) return;                 // already met, or pinned elsewhere
      if (b.s.has(c)) return;                                        // busy right now

  // partners who can take the place of m.host with m.startup, best first
  function partnerSubs(st, m) {

      const same = st.meetings.find((x) => x.startup === s0 && x.host === g);
      if (same && (same.k <= k || same.lock)) return;
      if (!same && D.other && D.other[s0 + "|" + g]) return;

    out.forEach((x) => (x.score = (x.pull ? 1 : 3) + (x.pref ? 4 : 0) - x.n * 0.3));

  document.getElementById("qinfo").addEventListener("click", (e) => {
    const b = e.target.closest("[data-pcard]"); if (!b) return;
    e.stopPropagation(); openPartner(b.dataset.pcard, b);
  });
  function fillList() {
    document.getElementById("qlist").innerHTML = Object.keys(D.startups).concat(Object.keys(D.hosts)).map((n) => '<option value="' + esc(n) + '">').join("");
  }

  // ---------------- misc ----------------
  function toast(t, bad) { const e = document.getElementById("toast"); e.textContent = t; e.className = "toast on" + (bad ? " bad" : ""); clearTimeout(tt); tt = setTimeout(() => (e.className = "toast"), 3600); }
  document.addEventListener("pointerdown", (e) => { if (!e.target.closest("#menu")) { if (menuFor && !e.target.closest("[data-drag]")) closeMenu(); onDown(e); } });
  document.addEventListener("pointermove", onMove);
  document.addEventListener("pointerup", () => endDrag(false));
  document.addEventListener("pointercancel", () => endDrag(true));
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { if (drag) endDrag(true); else if (!document.getElementById("menu") && full) setFull(false); closeMenu(); }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") { e.preventDefault(); undo(); }
  });
  document.addEventListener("click", (e) => {
    const mb = e.target.closest("#menu button"); if (mb) { menuClick(mb); return; }
    const sg = e.target.closest("[data-stag]"); if (sg && !drag) { setFocus(focusQ === sg.dataset.stag ? "" : sg.dataset.stag); return; }
    const b = e.target.closest("[data-act]"); if (!b) return;
    if (b.dataset.act === "undo") undo();
    if (b.dataset.act === "notes") { showNotes = !showNotes; render(); }
    if (b.dataset.act === "full") setFull(!full);
    if (b.dataset.act === "clashes") {
      const c = allClashes(S)[0]; if (!c) return;
      const el = document.querySelector('[data-id="' + cssEsc(c.id) + '"]');
      if (el) { el.scrollIntoView({ block: "center", inline: "center" }); el.classList.add("bump"); }
    }
  });
  setInterval(() => { if (D && !drag && !menuFor) render(); }, 30000);
  new ResizeObserver(() => { if (D) fit(); }).observe(document.body);

  window.addEventListener("message", (event) => {
    const msg = event.data;
    if (!msg || msg.type !== "streamlit:render") return;
    const args = msg.args || {};
    const data = typeof args.data === "string" ? JSON.parse(args.data) : args.data;
    if (msg.theme && msg.theme.base) document.body.classList.toggle("dark", msg.theme.base === "dark");
    if (!data) return;
    if (D && D.day === data.day && (data.version === version || mine.has(data.version))) {
      D.lang = data.lang || "en"; D.names = data.names || {};
      if (!drag && !menuFor) render();
      return;
    }
    const toSet = (arr) => { const o = {}; (arr || []).forEach((k) => (o[k] = true)); return o; };
    D = {
      day: data.day, tables: data.tables, tz: data.tz, date: data.date, rows: data.rows, sessions: data.sessions,
      ks: data.rows.filter((r) => r.kind === "slot").map((r) => r.k), slotByK: {}, startups: {}, hosts: {},
      polOk: toSet(data.polOk), polCap: data.polCap || 1, polOn: !!data.polOn, polPrior: data.polPrior || {}, notes: data.notes || [],
      names: data.names || {}, lang: data.lang || "en",
    };
    data.rows.forEach((r) => { if (r.kind === "slot") D.slotByK[r.k] = r; });
    // each startup keeps one soft colour so you can follow it down the waiting list
    const tones = startupTones(data.startups.length);
    data.startups.forEach((s, i) => (D.startups[s.name] = { tone: tones[i], avail: toSet(s.avail), priority: s.priority, presenter: s.presenter || "", no: toSet(s.no), pref: toSet(s.pref), tags: s.tags || "", otherN: s.otherN || 0 }));
    D.other = data.other || {};
    data.hosts.forEach((h) => (D.hosts[h.name] = { avail: toSet(h.avail), color: h.color, text: h.text, contact: h.contact,
      kind: h.kind || "", only: h.only || "", prefer: h.prefer || "", maxM: h.maxM }));
    S = { meetings: data.meetings || [], parked: data.parked || [], polish: data.polish || [], statuses: data.statuses || {} };
    version = data.version; hist.length = 0;
    fillList();
    hookStick();
    if (full) { try { window.frameElement.classList.add("bm-fs"); } catch (e) {} }
    render();
  });
  // test hook: same logic as a pointer drop
  window.__bm = { subs: (id) => { const m = S.meetings.find((x) => x.id === id); return m ? [startupSubs(S, m).map((r) => r.s), partnerSubs(S, m).map((r) => r.h)] : null; },
    focus: (q) => setFocus(q), host: (h, target) => { const p = simulateHost(h, target); return p && { kind: p.kind, text: p.text, pick: p.pick && p.pick.cands.map((c) => c.name) }; },
    hist: () => hist.length, version: () => version, state: () => S,
    drop: (type, id, target) => { const p = simulate({ type: type, id: id }, target); if (p && p.blocked) return { kind: p.kind, text: p.text, blocked: true }; if (p) commit(p.st, { snap: [p.focus], bump: p.moved.map((x) => x.id) }); return p && { kind: p.kind, text: p.text }; } };
  ST.ready();
})();
</script>
</body>
