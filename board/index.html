<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BizMatch board</title>
<style>
:root{--ink:#111827;--mut:#6b7280;--line:#e3e6ee;--bg:#ffffff;--zone:#f4f6fa;--head:#2b3a67;--cob:#1240e0;
 --red:#d92d20;--amber:#e08a00;--green:#14a44d;--panel:#ffffff;font-family:"Source Sans Pro","Source Sans 3",Inter,system-ui,sans-serif}
body.dark{--ink:#e8ebf3;--mut:#9aa3b8;--line:#2a3350;--bg:#0e1117;--zone:#161b28;--head:#24345f;--panel:#121725}
*{box-sizing:border-box}
html,body{margin:0;background:transparent;color:var(--ink);font-size:13px}
body{user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:2px 0 10px}
.btn{appearance:none;border:1px solid var(--line);background:var(--panel);border-radius:8px;min-height:34px;padding:0 12px;
 cursor:pointer;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--cob)}
.btn:disabled{opacity:.4;cursor:default}
.btn.on{background:var(--zone)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:4px 10px;background:var(--zone);font-weight:600;white-space:nowrap}
.pill i{width:9px;height:9px;border-radius:50%;display:inline-block}
.pill.bad{background:rgba(217,45,32,.12);color:var(--red);cursor:pointer}
.spacer{flex:1}
.clock{font-weight:700;font-variant-numeric:tabular-nums}
.notes{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 10px;background:var(--panel);display:grid;gap:4px}
.notes b{color:var(--red)}
.tray{border:1.5px dashed var(--line);border-radius:10px;padding:8px;margin:0 0 10px;display:flex;flex-wrap:wrap;gap:6px;
 align-items:center;min-height:48px;transition:background .12s,border-color .12s}
.tray .lab{color:var(--mut);font-weight:600;margin-right:4px}
.tray.hot{border-color:var(--cob);background:rgba(18,64,224,.06)}
.tray .chip{min-width:150px}
.wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel);position:relative}
table.g{border-collapse:separate;border-spacing:0;min-width:100%}
.g th{background:var(--head);color:#fff;font-weight:600;padding:9px 8px;position:sticky;top:0;z-index:3;white-space:nowrap;text-align:center}
.g td{border-bottom:1px solid var(--line);border-left:1px solid var(--line);padding:4px;vertical-align:middle}
.g td.sess{position:sticky;left:0;z-index:2;background:var(--panel);text-align:center;font-weight:700;min-width:92px;border-left:0}
.g td.sess small{display:block;font-weight:500;color:var(--mut)}
.g td.time{text-align:center;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums;min-width:104px}
.g tr.now td.time{color:#fff;background:var(--cob)}
.g tr.now td{background-color:rgba(18,64,224,.05)}
.g tr.brk td{background:var(--zone);color:var(--mut);font-weight:700;text-align:center;height:30px;letter-spacing:.02em}
.cell{min-width:138px;height:62px;border-radius:9px;transition:background .12s,box-shadow .12s;display:flex;align-items:stretch}
.cell.pc{min-width:150px;flex-direction:column;gap:3px}
.cell .dash{flex:1;display:flex;align-items:center;justify-content:center;color:var(--line);font-size:16px}
.cell.fit{box-shadow:inset 0 0 0 2.5px var(--green);background:rgba(20,164,77,.10)}
.cell.push{box-shadow:inset 0 0 0 2.5px var(--amber);background:rgba(224,138,0,.12)}
.cell.clash{box-shadow:inset 0 0 0 2.5px var(--red);background:rgba(217,45,32,.12)}
.cell.self{box-shadow:inset 0 0 0 2px var(--line)}
td.wait{font-size:11.5px;color:var(--mut);min-width:220px;max-width:340px;text-align:center;line-height:1.45}
.chip{flex:1;border-radius:9px;padding:6px 8px;text-align:center;cursor:grab;line-height:1.22;position:relative;
 touch-action:none;transition:transform .16s cubic-bezier(.2,.8,.2,1),box-shadow .16s,opacity .16s;
 display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:54px}
.chip:hover{box-shadow:0 2px 10px rgba(0,0,0,.15);transform:translateY(-1px)}
.chip b{font-size:13px;font-weight:700}
.chip .h{font-size:11px;opacity:.85}
.chip .st{margin-top:3px;font-size:10px;font-weight:700;border-radius:99px;padding:1px 7px;background:rgba(255,255,255,.78);color:#1f2430}
.chip .st.Ongoing{background:var(--cob);color:#fff}
.chip .st.Done{background:#ddf2e3;color:#1e7b34}
.chip .st.No-Show{background:#fde2e6;color:#b4132d}
.chip.ns{filter:grayscale(1);opacity:.55}
.chip.ns b{text-decoration:line-through}
.chip.done{opacity:.72}
.chip.ongoing{box-shadow:0 0 0 2.5px var(--cob)}
.chip .pin{position:absolute;top:4px;right:5px;width:11px;height:11px;opacity:.8}
.chip.bad{outline:2.5px solid var(--red);outline-offset:1px}
.chip.bad::after{content:"!";position:absolute;top:-7px;left:-7px;width:16px;height:16px;border-radius:50%;background:var(--red);
 color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center}
.chip.lift{opacity:.25;transform:scale(.96)}
.chip.snap{animation:snap .32s cubic-bezier(.2,.8,.2,1)}
.chip.bump{animation:bump .6s ease}
@keyframes snap{0%{transform:scale(1.10)}55%{transform:scale(.96)}100%{transform:scale(1)}}
@keyframes bump{0%{box-shadow:0 0 0 0 rgba(224,138,0,.9)}100%{box-shadow:0 0 0 12px rgba(224,138,0,0)}}
.chip.pol{color:#1f2430;min-height:50px;padding:4px 6px}
.chip.pol small{font-size:10px;opacity:.65;font-weight:600}
.ghost{position:fixed;z-index:60;pointer-events:none;box-shadow:0 14px 32px rgba(0,0,0,.28);transform:rotate(-1.5deg) scale(1.04);
 border-radius:9px}
.ghost[data-kind=fit]{box-shadow:0 0 0 3px var(--green),0 14px 32px rgba(0,0,0,.28)}
.ghost[data-kind=push]{box-shadow:0 0 0 3px var(--amber),0 14px 32px rgba(0,0,0,.28)}
.ghost[data-kind=clash]{box-shadow:0 0 0 3px var(--red),0 14px 32px rgba(0,0,0,.28)}
.ghost.snapped{transition:left .11s ease-out,top .11s ease-out;transform:rotate(0) scale(1)}
.hint{position:fixed;z-index:61;pointer-events:none;background:#111827;color:#fff;border-radius:8px;padding:6px 9px;font-size:12px;
 max-width:300px;line-height:1.35;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.hint.fit{background:#0f7a3a}.hint.push{background:#9a5b00}.hint.clash{background:#b42318}
.menu{position:absolute;z-index:70;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px;
 box-shadow:0 10px 28px rgba(0,0,0,.2);display:grid;min-width:190px}
.menu .t{font-weight:700;padding:4px 8px 6px;border-bottom:1px solid var(--line);margin-bottom:4px}
.menu .t small{display:block;font-weight:500;color:var(--mut)}
.menu button{appearance:none;border:0;background:none;text-align:left;padding:7px 8px;border-radius:6px;cursor:pointer;display:flex;gap:8px;align-items:center}
.menu button:hover,.menu button.cur{background:var(--zone)}
.menu .why{color:var(--red);padding:4px 8px;font-size:12px;max-width:260px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.toast{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);background:#111827;color:#fff;border-radius:10px;padding:9px 14px;
 font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:80;max-width:92vw}
.toast.on{opacity:1}
.toast.bad{background:#b42318}
.legend{display:flex;gap:12px;flex-wrap:wrap;color:var(--mut);font-size:12px}
.legend span{display:inline-flex;gap:5px;align-items:center}
.legend i{width:14px;height:10px;border-radius:3px;display:inline-block}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
(function () {
  "use strict";
  // ---------------- Streamlit component protocol (no build step needed) ----------------
  function send(type, data) { window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, data || {}), "*"); }
  const ST = {
    ready: () => send("streamlit:componentReady", { apiVersion: 1 }),
    height: (h) => send("streamlit:setFrameHeight", { height: h }),
    value: (v) => send("streamlit:setComponentValue", { value: v, dataType: "json" }),
  };

  const STATUSES = ["Scheduled", "Ongoing", "Done", "No-Show"];
  const I18N = {
    en: {},
    ko: {
      "Scheduled": "예정", "Ongoing": "진행 중", "Done": "완료", "No-Show": "노쇼",
      "Undo": "되돌리기", "Undone": "되돌렸어요", "No clashes": "충돌 없음", "{0} clash": "충돌 {0}건", "{0} clashes": "충돌 {0}건",
      "Show attendance notes": "참석 메모 보기", "Hide attendance notes": "참석 메모 숨기기", "Now {0}": "지금 {0}",
      "fits": "들어감", "pushes others": "다른 일정 밀어냄", "clash": "충돌",
      "Unplaced": "미배정", "Drag a meeting here to unschedule it": "미팅을 여기로 끌어오면 일정에서 빠져요",
      "None (all in sessions)": "없음 (모두 미팅 중)",
      "{0} is not available at {1}": "{0}은(는) {1}에 참석할 수 없어요",
      "{0} is also meeting {1} at {2}": "{0}은(는) {2}에 {1}와(과)도 미팅이 있어요",
      "{0} {1} is double booked": "{0} {1}에 두 미팅이 잡혔어요",
      "{0} is in pitch polishing at {1}": "{0}은(는) {1}에 피치 폴리싱 중이에요",
      "Pitch polishing does not run at {0}": "{0}에는 피치 폴리싱을 하지 않아요",
      "{0} has a meeting with {1} at {2}": "{0}은(는) {2}에 {1}와(과) 미팅이 있어요",
      "Only {0} polishing slot(s) at {1}": "{1}에는 폴리싱 자리가 {0}개뿐이에요",
      "Unschedule {0} with {1}": "{0} × {1} 미팅을 일정에서 빼기",
      "{0} with {1}": "{0} × {1}", "{0} polishing": "{0} 폴리싱",
      "Pushes {0} to {1}": "{0} → {1}(으)로 밀림", "Pushes {0} to Unplaced": "{0} → 미배정으로 밀림",
      "{0} cannot move and now clashes": "{0}은(는) 옮길 곳이 없어 충돌이 생겨요",
      "{0} pitch polishing → {1}": "{0} 피치 폴리싱 → {1}",
      "Placed with a clash. {0}": "충돌이 있는 채로 놓았어요. {0}",
      "with {0}": "{0}와(과)", "unplaced": "미배정", "Auto (follows the clock)": "자동 (시간에 따라)",
      "Pin here": "여기에 고정", "Unpin": "고정 해제", "Unschedule": "일정에서 빼기",
      "Drag it onto a table to schedule it": "테이블로 끌어다 놓으면 일정에 들어가요",
      "pitch polishing": "피치 폴리싱", "Focus: {0}": "포커스: {0}", "Remove this polishing slot": "이 폴리싱 일정 삭제",
      "1st": "1회차", "2nd": "2회차", "{0}th": "{0}회차", "polishing": "폴리싱", "Table": "테이블",
    },
  };
  const tr = (k, ...a) => { const t = (D && I18N[D.lang] && I18N[D.lang][k]) || k; return t.replace(/\{(\d)\}/g, (_, i) => a[+i]); };
  const stName = (s) => tr(s);
  const PIN = '<svg class="pin" viewBox="0 0 16 16"><path fill="currentColor" d="M10.4 1.2l4.4 4.4-1.5.7-2.5 2.5.3 3.2-1.4 1.4-2.9-2.9L2.6 14.7l-1.3-1.3 4.2-4.2-2.9-2.9L4 4.9l3.2.3 2.5-2.5z"/></svg>';
  let D = null;            // static data for the day (people, rows, colours)
  let S = null;            // editable state: meetings, parked, polish, statuses
  let version = null;
  const mine = new Set();  // versions this board produced (to ignore stale echoes)
  const hist = [];
  let showNotes = false, drag = null, menuFor = null, tt = 0, lastFlash = null;

  const $ = (sel) => document.querySelector(sel);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const fmt = (m) => {
    const t = Math.round(m * 60), h = Math.floor(t / 3600), mi = Math.floor((t % 3600) / 60), sec = t % 60;
    return String(h).padStart(2, "0") + ":" + String(mi).padStart(2, "0") + (sec ? ":" + String(sec).padStart(2, "0") : "");
  };
  const clone = (x) => JSON.parse(JSON.stringify(x));
  const slotOf = (k) => D.slotByK[k];

  // ---------------- time / status ----------------
  function nowInfo() {
    try {
      const f = new Intl.DateTimeFormat("en-CA", { timeZone: D.tz, year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hour12: false });
      const p = {}; f.formatToParts(new Date()).forEach((x) => (p[x.type] = x.value));
      const today = p.year + "-" + p.month + "-" + p.day, m = (+p.hour % 24) * 60 + +p.minute;
      return { cmp: !D.date ? 1 : D.date < today ? -1 : D.date > today ? 1 : 0, m: m, hm: fmt(m) };
    } catch (e) { return { cmp: 1, m: 0, hm: "" }; }
  }
  function statusOf(m) {
    const s = S.statuses[m.id];
    if (STATUSES.indexOf(s) >= 0) return s;
    if (m.k == null) return "Scheduled";
    const n = nowInfo(), sl = slotOf(m.k);
    if (n.cmp < 0) return "Done";
    if (n.cmp > 0) return "Scheduled";
    return n.m < sl.start ? "Scheduled" : n.m < sl.end ? "Ongoing" : "Done";
  }

  // ---------------- rules ----------------
  const avail = (who, k) => !!(who && who.avail[k]);
  function busy(st, k, skipIds) {
    const s = new Set(), h = new Set(), t = new Set();
    st.meetings.forEach((m) => { if (m.k === k && !(skipIds && skipIds.has(m.id))) { s.add(m.startup); h.add(m.host); t.add(m.table); } });
    st.polish.forEach((p) => { if (p.k === k && !(skipIds && skipIds.has(p.id))) s.add(p.startup); });
    return { s: s, h: h, t: t };
  }
  function meetingClash(st, m) {
    if (m.k == null) return [];
    const r = [], sl = slotOf(m.k), S_ = D.startups[m.startup], H_ = D.hosts[m.host];
    if (!avail(S_, m.k)) r.push(tr("{0} is not available at {1}", m.startup, fmt(sl.start)));
    if (!avail(H_, m.k)) r.push(tr("{0} is not available at {1}", m.host, fmt(sl.start)));
    st.meetings.forEach((x) => {
      if (x.id === m.id || x.k !== m.k) return;
      if (x.startup === m.startup) r.push(tr("{0} is also meeting {1} at {2}", m.startup, x.host, fmt(sl.start)));
      if (x.host === m.host) r.push(tr("{0} is also meeting {1} at {2}", m.host, x.startup, fmt(sl.start)));
      if (x.table === m.table) r.push(tr("{0} {1} is double booked", (D.names && D.names.table) || "Table", m.table));
    });
    st.polish.forEach((p) => { if (p.k === m.k && p.startup === m.startup) r.push(tr("{0} is in pitch polishing at {1}", m.startup, fmt(sl.start))); });
    return r;
  }
  function polishClash(st, p) {
    const r = [], sl = slotOf(p.k);
    if (!D.polOk[p.k]) r.push(tr("Pitch polishing does not run at {0}", fmt(sl.start)));
    if (!avail(D.startups[p.startup], p.k)) r.push(tr("{0} is not available at {1}", p.startup, fmt(sl.start)));
    st.meetings.forEach((m) => { if (m.k === p.k && m.startup === p.startup) r.push(tr("{0} has a meeting with {1} at {2}", p.startup, m.host, fmt(sl.start))); });
    const n = st.polish.filter((x) => x.k === p.k).length;
    if (n > D.polCap) r.push(tr("Only {0} polishing slot(s) at {1}", D.polCap, fmt(sl.start)));
    return r;
  }
  function allClashes(st) {
    const out = [];
    st.meetings.forEach((m) => meetingClash(st, m).forEach((t) => out.push({ id: m.id, text: t })));
    st.polish.forEach((p) => polishClash(st, p).forEach((t) => out.push({ id: p.id, text: t })));
    const seen = new Set();
    return out.filter((x) => (seen.has(x.text) ? false : (seen.add(x.text), true)));
  }

  // nearest valid free spot for a displaced meeting (ties go later, so it is "pushed" back)
  function findSpot(st, x, avoid, prefer) {
    const ok = (k, t) => {
      if (avoid.indexOf(k) >= 0) return false;
      if (!avail(D.startups[x.startup], k) || !avail(D.hosts[x.host], k)) return false;
      const b = busy(st, k);
      return !b.s.has(x.startup) && !b.h.has(x.host) && !b.t.has(t);
    };
    if (prefer && prefer.k != null && ok(prefer.k, prefer.t)) return prefer;
    const origin = x.k == null ? D.ks[0] : x.k;
    const order = D.ks.slice().sort((a, b) => Math.abs(a - origin) - Math.abs(b - origin) || b - a);
    for (const k of order) {
      if (avoid.indexOf(k) >= 0) continue;
      const pref = [x.table].concat(hostTables(st, x.host, k));
      for (let t of pref.concat(range(1, D.tables))) if (t >= 1 && t <= D.tables && ok(k, t)) return { k: k, t: t };
    }
    return null;
  }
  function hostTables(st, host, k) {
    const near = st.meetings.filter((m) => m.host === host && m.k != null).sort((a, b) => Math.abs(a.k - k) - Math.abs(b.k - k));
    return near.map((m) => m.table);
  }
  function findPolSpot(st, p, avoid) {
    const order = D.ks.slice().sort((a, b) => Math.abs(a - p.k) - Math.abs(b - p.k) || b - a);
    for (const k of order) {
      if (avoid.indexOf(k) >= 0 || !D.polOk[k] || !avail(D.startups[p.startup], k)) continue;
      const b = busy(st, k);
      if (b.s.has(p.startup)) continue;
      if (st.polish.filter((q) => q.k === k).length >= D.polCap) continue;
      return k;
    }
    return null;
  }
  const movedText = (x) => x.to == null ? tr("Pushes {0} to Unplaced", x.name)
    : x.to === "stays (clash)" ? tr("{0} cannot move and now clashes", x.name) : tr("Pushes {0} to {1}", x.name, x.to);
  const range = (a, b) => { const r = []; for (let i = a; i <= b; i++) r.push(i); return r; };

  // ---------------- simulate a drop ----------------
  function simulate(item, target) {
    const st = { meetings: clone(S.meetings), parked: clone(S.parked), polish: clone(S.polish), statuses: S.statuses };
    const moved = [];
    if (item.type === "m") {
      const A = S.meetings.find((m) => m.id === item.id) || S.parked.find((m) => m.id === item.id);
      st.meetings = st.meetings.filter((m) => m.id !== A.id);
      st.parked = st.parked.filter((m) => m.id !== A.id);
      if (target.type === "tray") {
        st.parked.push(Object.assign({}, A, { k: null, table: 0, lock: false }));
        return { st: st, moved: moved, kind: "fit", reasons: [], text: tr("Unschedule {0} with {1}", A.startup, A.host) };
      }
      const k = target.k, t = target.t;
      const a = Object.assign({}, A, { k: k, table: t, lock: true });
      const disp = st.meetings.filter((m) => m.k === k && (m.table === t || m.startup === a.startup || m.host === a.host));
      st.meetings = st.meetings.filter((m) => disp.indexOf(m) < 0);
      const dispP = st.polish.filter((p) => p.k === k && p.startup === a.startup);
      st.polish = st.polish.filter((p) => dispP.indexOf(p) < 0);
      st.meetings.push(a);
      disp.forEach((x) => {
        const sp = findSpot(st, x, [k], A.k != null ? { k: A.k, t: A.table } : null);
        if (sp) { st.meetings.push(Object.assign({}, x, { k: sp.k, table: sp.t })); moved.push({ id: x.id, name: tr("{0} with {1}", x.startup, x.host), to: fmt(slotOf(sp.k).start) }); }
        else { st.parked.push(Object.assign({}, x, { k: null, table: 0 })); moved.push({ id: x.id, name: tr("{0} with {1}", x.startup, x.host), to: null }); }
      });
      dispP.forEach((p) => {
        const c = findPolSpot(st, p, [k]);
        st.polish.push(Object.assign({}, p, { k: c == null ? p.k : c }));
        moved.push({ id: p.id, name: tr("{0} polishing", p.startup), to: c == null ? "stays (clash)" : fmt(slotOf(c).start) });
      });
      const reasons = meetingClash(st, a);
      const kind = reasons.length ? "clash" : moved.length ? "push" : "fit";
      let text = tr("{0} with {1}", A.startup, A.host) + " → " + fmt(slotOf(k).start) + ", " + ((D.names && D.names.table) || "Table") + " " + t;
      if (moved.length) text += "\n" + moved.map(movedText).join("\n");
      if (reasons.length) text += "\n" + reasons.join("\n");
      return { st: st, moved: moved, kind: kind, reasons: reasons, text: text, focus: a.id };
    }
    // polishing chip
    const P = S.polish.find((p) => p.id === item.id);
    if (target.type !== "pol") return null;
    const k = target.k;
    st.polish = st.polish.filter((p) => p.id !== P.id);
    const p2 = Object.assign({}, P, { k: k });
    const disp = st.meetings.filter((m) => m.k === k && m.startup === P.startup);
    st.meetings = st.meetings.filter((m) => disp.indexOf(m) < 0);
    let others = st.polish.filter((q) => q.k === k);
    const bump = others.length >= D.polCap ? others.slice(0, others.length - D.polCap + 1) : [];
    st.polish = st.polish.filter((q) => bump.indexOf(q) < 0);

    let text = tr("{0} pitch polishing → {1}", P.startup, fmt(slotOf(k).start));
    if (moved.length) text += "\n" + moved.map(movedText).join("\n");

  }

  // ---------------- commit / undo ----------------
  function snapshot() { return clone({ meetings: S.meetings, parked: S.parked, polish: S.polish, statuses: S.statuses }); }

  // ---------------- render ----------------
  function chipHTML(m, st, clashSet) {
    const H_ = D.hosts[m.host] || { color: "eeeeee", text: "1f2430", contact: "" };
    const s = statusOf(m), bad = clashSet.has(m.id);
    const cls = ["chip", s === "No-Show" ? "ns" : "", s === "Done" ? "done" : "", s === "Ongoing" ? "ongoing" : "", bad ? "bad" : ""].join(" ");

  }
  function polHTML(p, clashSet) {

    const tip = [p.note ? tr("Focus: {0}", p.note) : ""].concat(clashSet.has(p.id) ? polishClash(S, p) : []).filter(Boolean).join("\n");
    return '<div class="' + cls + '" data-drag="p" data-id="' + esc(p.id) + '" style="background:#' + bg + '"' + (tip ? ' title="' + esc(tip) + '"' : "") + "><b>"
      + esc(p.startup) + "</b><small>" + (who ? esc(who) + " · " : "") + (n === 1 ? tr("1st") : n === 2 ? tr("2nd") : tr("{0}th", n)) + " " + tr("polishing") + (p.note ? " ✎" : "")
      + '</small><span class="st ' + s + '">' + stName(s) + "</span></div>";

  function render() {
    if (!D) return;
    const st = S, clashes = allClashes(st), clashSet = new Set(clashes.map((c) => c.id));
    const n = nowInfo();
    const counts = { Scheduled: 0, Ongoing: 0, Done: 0, "No-Show": 0 };
    st.meetings.forEach((m) => counts[statusOf(m)]++);
    const at = {}; st.meetings.forEach((m) => (at[m.k + "|" + m.table] = m));
    const polAt = {}; st.polish.forEach((p) => (polAt[p.k] = polAt[p.k] || []).push(p));
    // session spans
    const spans = {}; let i = 0;
    while (i < D.rows.length) {
      if (D.rows[i].kind === "slot") { let j = i; while (j + 1 < D.rows.length && D.rows[j + 1].kind === "slot" && D.rows[j + 1].session === D.rows[i].session) j++; spans[i] = j - i + 1; i = j + 1; } else i++;
    }
    const N = D.names || {};
    let head = "<tr><th>" + esc(N.session || "Session") + "</th><th>" + esc(N.time || "Time") + "</th>";
    for (let t = 1; t <= D.tables; t++) head += "<th>" + esc(N.table || "Table") + " " + t + "</th>";
    head += (D.polOn ? "<th>" + esc(N.polish || "Pitch polishing") + "</th>" : "") + "<th>" + esc(N.waiting || "Waiting list") + "</th></tr>";
    let body = "";

      + STATUSES.map((s) => '<span class="pill"><i style="background:' + { Scheduled: "#9ca3af", Ongoing: "#1240e0", Done: "#16a34a", "No-Show": "#d92d20" }[s] + '"></i>' + counts[s] + " " + stName(s) + "</span>").join("")
      + notes + '<span class="spacer"></span>' + (n.cmp === 0 ? '<span class="clock">' + tr("Now {0}", n.hm) + "</span>" : "")
      + '<span class="legend"><span><i style="background:rgba(20,164,77,.35)"></i>' + tr("fits") + '</span><span><i style="background:rgba(224,138,0,.4)"></i>' + tr("pushes others") + '</span><span><i style="background:rgba(217,45,32,.4)"></i>' + tr("clash") + "</span></span></div>"
      + (showNotes ? '<div class="notes">' + D.notes.map((x) => "<div><b>" + esc(x[0]) + ":</b> " + esc(x[1]) + "</div>").join("") + "</div>" : "")
      + '<div class="tray" data-tray="1"><span class="lab">' + tr("Unplaced") + "</span>" + (parked || '<span style="color:var(--mut)">' + tr("Drag a meeting here to unschedule it") + "</span>") + "</div>"
      + '<div class="wrap" id="wrap"><table class="g"><thead>' + head + "</thead><tbody>" + body + "</tbody></table></div>";
    if (lastFlash) {
      (lastFlash.snap || []).forEach((id) => { const el = document.querySelector('[data-id="' + cssEsc(id) + '"]'); if (el) el.classList.add("snap"); });
      (lastFlash.bump || []).forEach((id) => { const el = document.querySelector('[data-id="' + cssEsc(id) + '"]'); if (el) el.classList.add("bump"); });

  }
  const cssEsc = (s) => (window.CSS && CSS.escape ? CSS.escape(s) : String(s).replace(/"/g, '\\"'));
  function fit() {
    const wrap = document.getElementById("wrap"); if (!wrap) return;
    const top = wrap.getBoundingClientRect().top;
    const want = Math.min(wrap.scrollHeight + 4, D.maxHeight);
    wrap.style.maxHeight = want + "px";
    ST.height(Math.ceil(top + want + 16 + (menuFor ? 0 : 0)));
  }

  // ---------------- drag and drop ----------------
  function targetAt(x, y) {
    const el = document.elementFromPoint(x, y); if (!el) return null;
    const c = el.closest("[data-cell]"); if (c) { const p = c.dataset.cell.split("|"); return { type: "cell", k: +p[0], t: +p[1], el: c }; }
    const p = el.closest("[data-pcell]"); if (p) return { type: "pol", k: +p.dataset.pcell, el: p };
    const tr = el.closest("[data-tray]"); if (tr) return { type: "tray", el: tr };

  }
  function clearHot() { document.querySelectorAll(".fit,.push,.clash,.hot").forEach((e) => { if (e.classList.contains("cell") || e.classList.contains("tray")) e.classList.remove("fit", "push", "clash", "hot"); }); }
  function onDown(e) {
    const c = e.target.closest("[data-drag]");
    if (!c || e.button > 0) return;
    closeMenu();
    drag = { el: c, id: c.dataset.id, type: c.dataset.drag, x0: e.clientX, y0: e.clientY, started: false, tgt: null, plan: null };
    try { c.setPointerCapture(e.pointerId); } catch (_) {}
  }

      drag.started = true;
      const r = drag.el.getBoundingClientRect();
      const g = drag.el.cloneNode(true); g.classList.add("ghost"); g.classList.remove("bad", "snap", "bump");
      g.style.width = r.width + "px"; g.style.height = r.height + "px";
      document.body.appendChild(g); drag.g = g; drag.w = r.width; drag.h = r.height;
      drag.dx = drag.x0 - r.left; drag.dy = drag.y0 - r.top;
      drag.el.classList.add("lift");

    }

  }

  // ---------------- click menu ----------------

    let h = "";
    if (type === "m") {
      const cur = STATUSES.indexOf(S.statuses[id]) >= 0 ? S.statuses[id] : "Auto";
      const why = item.k != null ? meetingClash(S, item) : [];
      h += '<div class="t">' + esc(item.startup) + "<small>" + esc(tr("with {0}", item.host)) + (item.k != null ? " · " + fmt(slotOf(item.k).start) + " · " + esc((D.names && D.names.table) || "Table") + " " + item.table : " · " + tr("unplaced")) + "</small></div>";

          h += '<button data-st="' + x[0] + '"' + (cur === x[0] ? ' class="cur"' : "") + '><span class="dot" style="background:' + x[1] + '"></span>' + (x[0] === "Auto" ? tr("Auto (follows the clock)") : stName(x[0])) + "</button>";

      h += '<div class="t">' + esc(item.startup) + "<small>" + tr("pitch polishing") + " · " + fmt(slotOf(item.k).start) + (who ? " · " + esc(who) : "") + "</small></div>";
      if (item.note) h += '<div class="why" style="color:var(--mut)">' + esc(tr("Focus: {0}", item.note)) + "</div>";

      [["Auto", "#cbd2e0"], ["Scheduled", "#9ca3af"], ["Ongoing", "#1240e0"], ["Done", "#16a34a"], ["No-Show", "#d92d20"]].forEach((x) => {
        h += '<button data-st="' + x[0] + '"' + (cur === x[0] ? ' class="cur"' : "") + '><span class="dot" style="background:' + x[1] + '"></span>' + (x[0] === "Auto" ? tr("Auto (follows the clock)") : stName(x[0])) + "</button>";

      return;
    }
    const toSet = (arr) => { const o = {}; (arr || []).forEach((k) => (o[k] = true)); return o; };
    D = {
      day: data.day, tables: data.tables, tz: data.tz, date: data.date, rows: data.rows, sessions: data.sessions,
      ks: data.rows.filter((r) => r.kind === "slot").map((r) => r.k), slotByK: {}, startups: {}, hosts: {},
      polOk: toSet(data.polOk), polCap: data.polCap || 1, polOn: !!data.polOn, polPrior: data.polPrior || {}, notes: data.notes || [],
      maxHeight: data.maxHeight || 900, names: data.names || {}, lang: data.lang || "en",
    };
    data.rows.forEach((r) => { if (r.kind === "slot") D.slotByK[r.k] = r; });
    data.startups.forEach((s) => (D.startups[s.name] = { avail: toSet(s.avail), priority: s.priority, presenter: s.presenter || "" }));
    data.hosts.forEach((h) => (D.hosts[h.name] = { avail: toSet(h.avail), color: h.color, text: h.text, contact: h.contact }));
    S = { meetings: data.meetings || [], parked: data.parked || [], polish: data.polish || [], statuses: data.statuses || {} };
    version = data.version; hist.length = 0;
    render();
  });
  // test hook: same logic as a pointer drop
  window.__bm = { hist: () => hist.length, version: () => version, state: () => S,
    drop: (type, id, target) => { const p = simulate({ type: type, id: id }, target); if (p) commit(p.st, { snap: [p.focus], bump: p.moved.map((x) => x.id) }); return p && { kind: p.kind, text: p.text }; } };
  ST.ready();
})();
</script>
